<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      width: 80%;
      max-width: 400px;
    }
    .korean { font-size: 64px; margin-bottom: 20px; cursor: pointer; }
    .english { font-size: 24px; color: #555; display: none; }
    .nav {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    .arrow {
      font-size: 36px;
      cursor: pointer;
      user-select: none;
      padding: 10px;
    }
    .home-button {
      margin-top: 30px;
      font-size: 18px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="korean" class="korean"></div>
    <div id="english" class="english"></div>
    <div class="nav">
      <div id="prev" class="arrow">&#8592;</div>
      <div id="next" class="arrow">&#8594;</div>
    </div>
    <a href="index.html" class="home-button">Home</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const letter = urlParams.get('letter');
    let words = [];
    let currentIndex = 0;

    const koreanEl = document.getElementById('korean');
    const englishEl = document.getElementById('english');

    function showCard(index) {
      if (words.length === 0) return;
      koreanEl.textContent = words[index].korean;
      englishEl.textContent = words[index].english;
      englishEl.style.display = 'none';
    }

    koreanEl.addEventListener('click', () => {
      englishEl.style.display = englishEl.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('prev').onclick = () => {
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      showCard(currentIndex);
    };

    document.getElementById('next').onclick = () => {
      currentIndex = (currentIndex + 1) % words.length;
      showCard(currentIndex);
    };

    if (letter) {
      fetch(`data/${letter}.json`)
        .then(response => response.json())
        .then(data => {
          words = data;
          if (words.length > 0) showCard(currentIndex);
          else koreanEl.textContent = "No words found.";
        })
        .catch(() => {
          koreanEl.textContent = "Failed to load data.";
        });
    } else {
      koreanEl.textContent = "No letter selected.";
    }
  </script>
</body>
</html>
